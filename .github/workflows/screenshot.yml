name: Screenshot

# The actions are referenced by path, so every run exercises them as the checked-out
# commit has them. A pull request runs only the review job, though: changes to
# baseline-publish are first exercised by the push to main that merges them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    name: Publish baselines
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Publishing rebuilds the storage branch from what it read and force-pushes it, so
    # two runs at once would drop each other's generation.
    concurrency:
      group: screenshot-baselines
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Captured from scratch rather than on top of a pulled generation, so the
      # baseline of a removed screenshot does not live on.
      - name: Capture screenshots
        uses: ./run
        with:
          command: npx playwright test --update-snapshots=all

      - name: Publish baselines
        uses: ./baseline-publish
        with:
          sha: ${{ github.sha }}
          github-token: ${{ github.token }}

  review:
    name: Review screenshots
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull baseline
        id: baseline
        uses: ./baseline-pull

      - name: Run screenshot tests
        id: screenshot
        uses: ./run
        with:
          command: npx playwright test

      - name: Report diffs
        if: failure() && steps.screenshot.outcome == 'failure'
        uses: ./diff-report
        with:
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}

      - name: Write status
        if: always()
        uses: ./review-status
        with:
          sha: ${{ github.event.pull_request.head.sha }}
          state: ${{ steps.screenshot.outcome == 'success' && 'success' || 'failure' }}
          note: ${{ steps.baseline.outputs.note }}
          github-token: ${{ github.token }}
